# Infinity Build Plugin - Gradle Properties

# Plugin Version
version=1.0.0-SNAPSHOT

# Kotlin Version
kotlin.version=1.9.22

# Gradle JVM args
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configuration-cache=true

# IntelliJ Platform
intellij.version=2023.1
intellij.type=IC

# Plugin Metadata
plugin.name=Infinity Build
plugin.description=Infinity Build - AI-powered development companion for JetBrains IDEs
plugin.vendor=Infinity AI
plugin.vendor.email=kasperkal1970@gmail.com
plugin.vendor.url=https://github.com/kasper-kal/Infinity-AI

# Supported IDEs (all 2023.1+)
# IntelliJ IDEA Ultimate/Community
# WebStorm
# PyCharm Professional/Community
# GoLand
# Rider
# PhpStorm
# RubyMine
# CLion
# DataGrip
# Android Studio

# Build settings
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.js=false
kotlin.incremental.mpp=false