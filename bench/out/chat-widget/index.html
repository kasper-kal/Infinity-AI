<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat — widget</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app" aria-label="Chat widget demo">
    <div id="widget" class="widget">
      <header class="whead">
        <div class="who">
          <span class="avatar" aria-hidden="true">B</span>
          <div>
            <strong>Support · Boxly</strong>
            <span class="online">online · replies instantly</span>
          </div>
        </div>
      </header>

      <div id="messages" class="messages" role="log" aria-live="polite"></div>

      <div id="error-banner" class="error" hidden>
        <strong>Sending failed.</strong> Check your connection and try again.
        <button id="retry" type="button">Retry</button>
      </div>

      <form id="composer" class="composer">
        <input id="input" type="text" maxlength="280" placeholder="Type a message…" aria-label="Message" autocomplete="off">
        <button id="send" type="submit" disabled>Send</button>
      </form>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
