<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinity Remote Chat</title>
  <style>
    :root {
      --bg: #0a0a0b;
      --bg-elevated: #141416;
      --bg-overlay: #1c1c1e;
      --fg: #fafafa;
      --fg-muted: #71717a;
      --border: #27272a;
      --border-primary: #3f3f46;
      --accent: #22d3ee;
      --accent-hover: #06b6d4;
      --accent-bg: rgba(34, 211, 238, 0.1);
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #f59e0b;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'SF Mono', 'Fira Code', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(20px);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      color: var(--bg);
    }

    h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      background: var(--bg-overlay);
      border: 1px solid var(--border);
      color: var(--fg);
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover { background: var(--border); border-color: var(--border-primary); }
    .btn:active { transform: scale(0.98); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
    .btn.primary:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn svg { width: 16px; height: 16px; }

    /* Main Layout */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Session List View */
    .session-list-view {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
    }

    .session-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 600px;
      margin: 0 auto;
    }

    .session-item {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .session-item:hover {
      border-color: var(--border-primary);
      transform: translateY(-1px);
      box-shadow: var(--shadow);
    }

    .session-item.active {
      border-color: var(--accent);
      background: var(--accent-bg);
    }

    .session-avatar {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 16px;
      color: var(--bg);
      flex-shrink: 0;
    }

    .session-info {
      flex: 1;
      min-width: 0;
    }

    .session-name {
      font-weight: 600;
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .session-meta {
      font-size: 12px;
      color: var(--fg-muted);
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .session-status {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--fg-muted);
    }

    .status-dot.active { background: var(--success); }
    .status-dot.busy { background: var(--warning); }

    /* Chat View */
    .chat-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      display: flex;
      gap: 10px;
      max-width: 100%;
    }

    .message.user { flex-direction: row-reverse; }

    .message-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .message.user .message-avatar {
      background: var(--accent);
      color: var(--bg);
    }

    .message.assistant .message-avatar {
      background: linear-gradient(135deg, #8b5cf6, #a855f7);
      color: white;
    }

    .message.system .message-avatar {
      background: var(--fg-muted);
      color: var(--bg);
    }

    .message-content {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      max-width: 85%;
      word-wrap: break-word;
    }

    .message.user .message-content {
      background: var(--accent-bg);
      border-color: var(--accent);
      border-bottom-right-radius: 4px;
    }

    .message.assistant .message-content {
      border-bottom-left-radius: 4px;
    }

    .message.system .message-content {
      background: var(--bg-overlay);
      border-color: var(--border-primary);
      font-size: 12px;
      color: var(--fg-muted);
      text-align: center;
      max-width: 100%;
    }

    .message-text {
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .message-text code {
      font-family: var(--font-mono);
      font-size: 13px;
      background: var(--bg-overlay);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .message-text pre {
      background: #0d0d0e;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      overflow-x: auto;
      margin-top: 8px;
    }

    .message-text pre code {
      background: transparent;
      padding: 0;
      font-size: 12px;
      line-height: 1.6;
    }

    .message-time {
      font-size: 11px;
      color: var(--fg-muted);
      margin-top: 4px;
      text-align: right;
    }

    .message.user .message-time {
      text-align: left;
    }

    /* Input Area */
    .chat-input-area {
      background: var(--bg-elevated);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      max-width: 800px;
      margin: 0 auto;
    }

    .input-wrapper {
      flex: 1;
      position: relative;
    }

    .chat-input {
      width: 100%;
      background: var(--bg-overlay);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      color: var(--fg);
      font-size: 14px;
      font-family: var(--font-sans);
      resize: none;
      min-height: 48px;
      max-height: 160px;
      line-height: 1.5;
      transition: border-color 0.15s ease;
    }

    .chat-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .chat-input::placeholder {
      color: var(--fg-muted);
    }

    .send-btn {
      width: 44px;
      height: 44px;
      border-radius: var(--radius);
      background: var(--accent);
      border: none;
      color: var(--bg);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .send-btn:hover { background: var(--accent-hover); transform: scale(1.02); }
    .send-btn:active { transform: scale(0.98); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .send-btn svg { width: 20px; height: 20px; }

    /* Loading / Empty States */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--fg-muted);
      text-align: center;
      padding: 32px;
    }

    .empty-state svg { width: 64px; height: 64px; margin-bottom: 16px; opacity: 0.5; }
    .empty-state h3 { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: var(--fg); }
    .empty-state p { font-size: 14px; line-height: 1.5; }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow-lg);
      animation: slideIn 0.3s ease;
      max-width: 320px;
    }

    .toast.error { border-color: var(--danger); }
    .toast.success { border-color: var(--success); }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(100px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* Mobile adjustments */
    @media (max-width: 640px) {
      .chat-input-area { padding: 10px 12px; }
      .chat-messages { padding: 12px; gap: 10px; }
      .message-content { max-width: 90%; padding: 10px 14px; }
      .session-item { padding: 14px; }
      .session-avatar { width: 40px; height: 40px; }
      header { padding: 10px 12px; }
      h1 { font-size: 15px; }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-primary); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--fg-muted); }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <div class="logo">∞</div>
      <h1 id="pageTitle">Remote Chat</h1>
    </div>
    <div class="header-right" id="headerActions"></div>
  </header>

  <main id="main">
    <!-- Session List View -->
    <div class="session-list-view" id="sessionListView">
      <div class="session-list" id="sessionList"></div>
    </div>

    <!-- Chat View -->
    <div class="chat-view" id="chatView" style="display: none;">
      <div class="chat-header">
        <button class="btn" id="backBtn" style="padding: 6px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <div style="flex: 1; min-width: 0;">
          <div id="chatSessionName" style="font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Session</div>
          <div id="chatSessionStatus" style="font-size: 11px; color: var(--fg-muted);">Connecting...</div>
        </div>
        <button class="btn" id="clearHistoryBtn" title="Clear local history">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-area">
        <div class="input-row">
          <div class="input-wrapper">
            <textarea
              class="chat-input"
              id="chatInput"
              placeholder="Type a message..."
              rows="1"
            ></textarea>
          </div>
          <button class="send-btn" id="sendBtn" aria-label="Send message">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Loading -->
    <div class="loading" id="loadingView" style="display: none;">
      <div class="spinner"></div>
    </div>
  </main>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    // Configuration
    const WS_URL = `ws://${window.location.host}`;
    const API_URL = window.location.origin;

    // State
    let ws = null;
    let currentSessionId = null;
    let currentSessionName = null;
    let sessions = [];
    let reconnectAttempts = 0;
    const maxReconnectAttempts = 5;
    const reconnectDelay = 2000;

    // DOM Elements
    const sessionListView = document.getElementById('sessionListView');
    const sessionList = document.getElementById('sessionList');
    const chatView = document.getElementById('chatView');
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const backBtn = document.getElementById('backBtn');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');
    const chatSessionName = document.getElementById('chatSessionName');
    const chatSessionStatus = document.getElementById('chatSessionStatus');
    const pageTitle = document.getElementById('pageTitle');
    const headerActions = document.getElementById('headerActions');
    const loadingView = document.getElementById('loadingView');
    const toastContainer = document.getElementById('toastContainer');

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      loadSessions();
      setupEventListeners();
      autoResizeTextarea();
    });

    function setupEventListeners() {
      // Back button
      backBtn.addEventListener('click', showSessionList);

      // Clear history
      clearHistoryBtn.addEventListener('click', () => {
        if (confirm('Clear local chat history for this session?')) {
          chatMessages.innerHTML = '';
        }
      });

      // Send button
      sendBtn.addEventListener('click', sendMessage);

      // Enter to send, Shift+Enter for newline
      chatInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      // Auto-resize textarea
      chatInput.addEventListener('input', autoResizeTextarea);
    }

    function autoResizeTextarea() {
      chatInput.style.height = 'auto';
      chatInput.style.height = Math.min(chatInput.scrollHeight, 160) + 'px';
    }

    // Toast notifications
    function showToast(message, type = 'info') {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      toastContainer.appendChild(toast);
      setTimeout(() => {
        toast.style.animation = 'slideIn 0.3s ease reverse';
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    // View switching
    function showSessionList() {
      chatView.style.display = 'none';
      sessionListView.style.display = 'block';
      pageTitle.textContent = 'Remote Chat';
      headerActions.innerHTML = `
        <button class="btn" id="refreshBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          <span>Refresh</span>
        </button>
      `;
      document.getElementById('refreshBtn').addEventListener('click', loadSessions);
      loadSessions();
    }

    function showChatView(sessionId, sessionName) {
      currentSessionId = sessionId;
      currentSessionName = sessionName;
      sessionListView.style.display = 'none';
      chatView.style.display = 'flex';
      pageTitle.textContent = sessionName;
      chatSessionName.textContent = sessionName;
      chatSessionStatus.textContent = 'Connecting...';
      chatMessages.innerHTML = '';
      connectToSession(sessionId);
    }

    // Load sessions from API
    async function loadSessions() {
      sessionList.innerHTML = '<div class="loading" style="padding: 40px;"><div class="spinner"></div></div>';
      try {
        const res = await fetch(`${API_URL}/api/sessions`);
        if (!res.ok) throw new Error('Failed to load sessions');
        sessions = await res.json();
        renderSessionList();
      } catch (err) {
        console.error('Failed to load sessions:', err);
        showToast('Failed to load sessions: ' + err.message, 'error');
        sessionList.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><h3>Failed to load sessions</h3><p>${err.message}</p><button class="btn primary" style="margin-top: 16px;" onclick="loadSessions()">Retry</button></div>`;
      }
    }

    function renderSessionList() {
      if (sessions.length === 0) {
        sessionList.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><h3>No Claude sessions found</h3><p>Start a Claude Code session in your terminal, then refresh.</p><button class="btn primary" style="margin-top: 16px;" onclick="loadSessions()">Refresh</button></div>`;
        return;
      }

      sessionList.innerHTML = sessions.map(s => `
        <div class="session-item" data-session-id="${s.id}" onclick="joinSession('${s.id}', '${escapeHtml(s.name)}')">
          <div class="session-avatar">${escapeHtml(s.name.charAt(0).toUpperCase())}</div>
          <div class="session-info">
            <div class="session-name">${escapeHtml(s.name)}</div>
            <div class="session-meta">
              <span class="session-status">
                <span class="status-dot"></span>
                <span>Ready</span>
              </span>
              <span>ID: ${escapeHtml(s.id)}</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function joinSession(sessionId, sessionName) {
      showChatView(sessionId, sessionName);
    }

    // WebSocket connection
    function connectToSession(sessionId) {
      if (ws) {
        ws.close();
      }

      ws = new WebSocket(`${WS_URL}`);

      ws.onopen = () => {
        reconnectAttempts = 0;
        chatSessionStatus.textContent = 'Connected';
        chatSessionStatus.style.color = 'var(--success)';

        // Join the session
        ws.send(JSON.stringify({ type: 'join', sessionId }));
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          handleWebSocketMessage(msg);
        } catch (err) {
          console.error('Failed to parse WS message:', err);
        }
      };

      ws.onclose = () => {
        chatSessionStatus.textContent = 'Disconnected';
        chatSessionStatus.style.color = 'var(--danger)';

        if (reconnectAttempts < maxReconnectAttempts) {
          reconnectAttempts++;
          chatSessionStatus.textContent = `Reconnecting... (${reconnectAttempts}/${maxReconnectAttempts})`;
          chatSessionStatus.style.color = 'var(--warning)';
          setTimeout(() => connectToSession(sessionId), reconnectDelay);
        } else {
          showToast('Connection lost. Please refresh.', 'error');
        }
      };

      ws.onerror = (err) => {
        console.error('WebSocket error:', err);
        showToast('Connection error', 'error');
      };
    }

    function handleWebSocketMessage(msg) {
      switch (msg.type) {
        case 'joined':
          chatSessionStatus.textContent = 'Connected';
          chatSessionStatus.style.color = 'var(--success)';
          if (msg.payload?.history) {
            msg.payload.history.forEach(entry => {
              if (typeof entry === 'string') {
                // Backward compatibility with old format
                addMessage(entry, 'system');
              } else if (entry && typeof entry === 'object' && entry.role && entry.content) {
                // New format with role and content
                addMessage(entry.content, entry.role, entry.timestamp);
              }
            });
          }
          break;

        case 'output':
          if (msg.payload && typeof msg.payload === 'object' && msg.payload.role && msg.payload.content) {
            addMessage(msg.payload.content, msg.payload.role, msg.payload.timestamp);
          } else if (typeof msg.payload === 'string') {
            // Backward compatibility
            addMessage(msg.payload, 'assistant');
          }
          break;

        case 'sessions':
          sessions = msg.payload;
          renderSessionList();
          break;

        case 'queued':
          showToast('Message queued', 'info');
          break;

        case 'dequeued':
          // Message sent to Claude
          break;

        case 'claude_idle':
          chatSessionStatus.textContent = 'Claude ready';
          chatSessionStatus.style.color = 'var(--success)';
          break;

        case 'automation_added':
        case 'automation_removed':
        case 'automation_toggled':
        case 'automations':
          // Automation updates - could add UI for this later
          break;

        case 'pong':
          // Heartbeat
          break;

        default:
          console.log('Unknown message type:', msg.type, msg);
      }
    }

    function addMessage(content, role = 'assistant', timestamp?: number) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role}`;

      const isUser = role === 'user';
      const isSystem = role === 'system';
      const avatarChar = isUser ? 'You' : (isSystem ? '⚙' : 'AI');
      const avatarClass = isUser ? 'user' : (isSystem ? 'system' : 'assistant');

      // Use provided timestamp or current time
      const time = timestamp ? new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      // Format content - preserve markdown/code blocks
      const formattedContent = formatMessage(content);

      msgDiv.innerHTML = `
        <div class="message-avatar ${avatarClass}">${isSystem ? '⚙' : (isUser ? 'You' : 'AI')}</div>
        <div class="message-content">
          <div class="message-text">${formattedContent}</div>
          <div class="message-time">${time}</div>
        </div>
      `;

      chatMessages.appendChild(msgDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function formatMessage(text) {
      if (!text) return '';

      // Escape HTML first
      let formatted = escapeHtml(text);

      // Convert markdown code blocks
      formatted = formatted.replace(/```(\w+)?\n([\s\S]*?)```/g, (match, lang, code) => {
        return `<pre><code class="language-${lang || ''}">${code.trim()}</code></pre>`;
      });

      // Convert inline code
      formatted = formatted.replace(/`([^`]+)`/g, '<code>$1</code>');

      // Convert line breaks
      formatted = formatted.replace(/\n/g, '<br>');

      return formatted;
    }

    function sendMessage() {
      const text = chatInput.value.trim();
      if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

      // Add to local chat immediately
      addMessage(text, 'user');
      chatInput.value = '';
      autoResizeTextarea();

      // Send via WebSocket
      ws.send(JSON.stringify({ type: 'input', payload: text }));
    }

    // Make functions globally accessible for onclick handlers
    window.joinSession = joinSession;
    window.loadSessions = loadSessions;
  </script>
</body>
</html>
